[project]
name = "ontology-layer"
version = "0.1.0"
description = "Ontology layer for text-to-SQL: automatically generate a business ontology from your database and expose it to an LLM agent as tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk",
    "litellm",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
]
